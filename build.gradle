plugins {
    id 'java'
}

group = 'com.projectfoundation'
version = '0.1.0-alpha'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('copyPlugin', Copy) {
    dependsOn jar

    from("$buildDir/libs")
    include("FoundationCore-*.jar")

    into("C:/ProjectFoundation_SkyBlock/server/plugins")
}

build.finalizedBy(copyPlugin)